name: CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: frontend/fmcg-plant-ems-deploy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/fmcg-plant-ems-deploy/.nvmrc
          cache: npm
          cache-dependency-path: frontend/fmcg-plant-ems-deploy/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
